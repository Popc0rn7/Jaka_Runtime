# Orbbec Gemini 336L color stream via pyorbbecsdk.
orbbec:
  device: ""
  # capture image size
  width: 1280
  height: 720
  fps: 30
  output_width: 640
  output_height: 480
  startup_timeout: 3.0

  color_format: "" # Empty keeps the device default (MJPG on the 336L).
  rotate_180: true # camera is upside down on the robot
