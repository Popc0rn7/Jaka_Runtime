client:
  host: "192.168.2.108" 
  port: 5678
  timeout: 1.0
  angle_num: 6
  frame_header: aa555aa569

gripper:
  port: "/dev/ttyUSB0"
  force: 50
  velocity: 50

# Robot and remote policy settings used by script/inference.py.  Keep the
# observation names aligned with the checkpoint training configuration.
robot:
  ip: "192.168.2.116"
  freq_hz: 30
  init_joint: [0.0, 1.57, 1.57, 1.57, -1.57, 2.36]

policy:
  host: "127.0.0.1"
  port: 8000
  action_key: "actions"
  image_size: 224
  task: "Pick an orange and place it into the pink bowl."
  # JAKA OpenPI serving contract: state + exterior and wrist RGB views.
  state_key: "state"
  agent_view_key: "image"
  wrist_key: "wrist_image"
  prompt_key: "prompt"
  # The first policy target is reached with this slow, controlled move.
  ramp_steps: 250

# Reject an unsafe policy response before it reaches the robot.  Adjust the
# joint ranges to the limits of the particular robot installation/checkpoint.
safety:
  # JAKA S5 mechanical joint ranges, in radians.
  joint_min: [-6.2832, -1.4835, -3.0543, -1.4835, -6.2832, -6.2832]
  joint_max: [6.2832, 4.6251, 3.0543, 4.6251, 6.2832, 6.2832]
  # Position-jump guard.  At 30 Hz this also caps commanded speed at 3 rad/s.
  max_joint_step: 0.10
  # Explicit command-speed guard in rad/s, below S5's specified pi rad/s.
  max_joint_speed: 3.0

# ZED 2i UVC/V4L2 RGB source. Width is the complete side-by-side frame;
# the driver crops the selected eye and returns the configured uint8 RGB size.
zed:
  device: "/dev/video8"
  width: 2560
  height: 720
  fps: 30
  fourcc: ""
  eye: "left"
  output_width: 640
  output_height: 480
  startup_timeout: 3.0

# Orbbec Gemini 336L color stream via pyorbbecsdk. width/height is the native
# color profile requested from the SDK; output_width/output_height is the uint8
# RGB size read() returns — center-cropped to that aspect ratio, then resized.
orbbec:
  # Leave empty to select the first connected Orbbec device.
  serial_number: ""      # empty picks the first camera found
  width: 1280
  height: 720
  fps: 30
  # Leave empty to let the SDK choose a compatible profile format.
  color_format: ""       # empty keeps the device default (MJPG on the 336L)
  output_width: 640
  output_height: 480
  # The wrist camera is physically installed upside down on this robot.
  rotate_180: true
  startup_timeout: 3.0

# Web preview for headless collection hosts. Keep this on localhost and use an
# SSH tunnel from the operator's workstation; the stream has no authentication.
display:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  fps: 30
  jpeg_quality: 80

replay:
  dataset_root: "data/demo/20260820_153529"
  episode: 0
